# LLM Gate VM：时钟源由 llmgate-vm-init 每次启动写到 /run/llmgate-vm/chrony/——有 KVM PTP 时钟
# （CONFIG_PTP_1588_CLOCK_KVM，宿主时钟源为 TSC 时可用）就用 `refclock PHC /dev/ptpN poll 3 dpoll -2 offset 0` 跟宿主走、
# 不连网络；没有（嵌套虚拟化等）才退回 NTP 池。chronyd 打不开 refclock 设备会直接退出，所以不写死在这里。
# 宿主暂停或挂起后 guest 时钟可能大跳，makestep 不限次数地直接步进。
confdir /run/llmgate-vm/chrony
makestep 1.0 -1
driftfile /var/lib/chrony/chrony.drift
