# LLM Gate VM 的 sshd 设置（Include 在 sshd_config 开头，这里的取值优先）。
#
# 主机私钥由设备生成、随建 VM 请求写进数据盘（/home/.llmgate-vm/，root 0600）：身份随数据盘，重建系统盘后主机公钥
# 不变。系统盘上不放、启动时也不生成任何主机密钥。
HostKey /home/.llmgate-vm/ssh_host_ed25519_key

# 只认公钥：设备以 dev 的证书公钥登录；客户经 `ssh -J <节点> dev@<VM>` 用自己加进 authorized_keys 的公钥。
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no

# 转发：devd 的 Unix socket 走 direct-streamlocal；对话、创作引擎与任务编排要远程 TCP 转发。
AllowStreamLocalForwarding yes
AllowTcpForwarding yes
StreamLocalBindUnlink yes
X11Forwarding no

# 设备经节点中转、一台 VM 上会同时开多个终端与对话：放宽单连接的会话数与未认证连接的并发上限。
MaxSessions 64
MaxStartups 64:30:256
ClientAliveInterval 30
ClientAliveCountMax 4

UseDNS no
PrintMotd no
